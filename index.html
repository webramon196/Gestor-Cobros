<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Cobros</title>
    <!-- Tailwind CSS para diseño profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            // Cargar datos de localStorage
            const [registros, setRegistros] = useState(() => {
                const guardados = localStorage.getItem('cobros_data');
                return guardados ? JSON.parse(guardados) : [];
            });

            const [formulario, setFormulario] = useState({
                fabrica: '',
                cliente: '',
                fecha: new Date().toISOString().split('T')[0],
                monto: '',
                estado: 'Pagado'
            });

            const [confirmarBorrado, setConfirmarBorrado] = useState(false);

            // Guardar en localStorage cada vez que cambien los registros
            useEffect(() => {
                localStorage.setItem('cobros_data', JSON.stringify(registros));
                if (window.lucide) window.lucide.createIcons();
            }, [registros]);

            // LÓGICA DE CÁLCULO SOLICITADA
            const estadisticas = useMemo(() => {
                return registros.reduce((acc, curr) => {
                    const monto = parseFloat(curr.monto) || 0;
                    
                    if (curr.estado === 'Pagado') {
                        acc.balanceReal += monto;
                        acc.totalPagado += monto;
                    } else if (curr.estado === 'Abono') {
                        acc.balanceReal -= monto;
                        acc.totalAbonos += monto;
                    } else if (curr.estado === 'Pendiente de cobro') {
                        acc.totalPendiente += monto;
                        // NO afecta al balanceReal
                    }
                    
                    return acc;
                }, { balanceReal: 0, totalPagado: 0, totalPendiente: 0, totalAbonos: 0 });
            }, [registros]);

            const manejarAgregar = (e) => {
                e.preventDefault();
                const nuevoRegistro = {
                    ...formulario,
                    id: Date.now(),
                    monto: parseFloat(formulario.monto)
                };
                setRegistros([nuevoRegistro, ...registros]);
                setFormulario({ ...formulario, monto: '', fecha: new Date().toISOString().split('T')[0] });
            };

            const eliminarRegistro = (id) => {
                setRegistros(registros.filter(r => r.id !== id));
            };

            const exportarPDF = async () => {
                const cargarScript = (src) => new Promise(res => {
                    const s = document.createElement('script'); s.src = src; s.onload = res; document.head.appendChild(s);
                });
                
                if (!window.jspdf) {
                    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
                    await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js');
                }
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(18);
                doc.setTextColor(0, 128, 128);
                doc.text('REPORTE DE CAJA Y COBROS', 14, 20);
                
                const filas = registros.map(r => [
                    r.fabrica, 
                    r.cliente, 
                    r.fecha, 
                    r.estado, 
                    `${r.estado === 'Abono' ? '-' : ''}${r.monto.toFixed(2)} €`
                ]);

                filas.push([
                    { content: 'BALANCE TOTAL REAL (CAJA):', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240] } },
                    { content: `${estadisticas.balanceReal.toFixed(2)} €`, styles: { fontStyle: 'bold', fillColor: [240, 240, 240] } }
                ]);

                doc.autoTable({
                    head: [['Fábrica', 'Cliente', 'Fecha', 'Estado', 'Importe']],
                    body: filas,
                    startY: 30,
                    headStyles: { fillColor: [0, 128, 128] }
                });
                
                doc.save(`Balance_Cobros_${new Date().toLocaleDateString()}.pdf`);
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        {/* Cabecera */}
                        <div className="bg-white rounded-2xl shadow-sm border-l-8 border-teal-600 p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-black text-teal-800">Mi Cartera de Cobros</h1>
                                <p className="text-gray-500 text-sm italic">Pendientes no computan en el balance real</p>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => {
                                        if(confirmarBorrado) { setRegistros([]); setConfirmarBorrado(false); }
                                        else { setConfirmarBorrado(true); setTimeout(() => setConfirmarBorrado(false), 3000); }
                                    }}
                                    className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${confirmarBorrado ? 'bg-red-600 text-white animate-pulse' : 'bg-red-50 text-red-600'}`}
                                >
                                    {confirmarBorrado ? '¿Confirmar?' : 'Limpiar Datos'}
                                </button>
                                <button onClick={exportarPDF} className="bg-teal-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg hover:bg-teal-700 transition-all">
                                    Generar PDF
                                </button>
                            </div>
                        </div>

                        {/* Tarjetas de Resumen */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-teal-600">
                                <span className="text-[10px] uppercase font-black text-gray-400">Balance Real</span>
                                <div className="text-2xl font-black text-teal-700">{estadisticas.balanceReal.toFixed(2)}€</div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-emerald-500">
                                <span className="text-[10px] uppercase font-black text-gray-400">Pagados</span>
                                <div className="text-2xl font-black text-emerald-600">{estadisticas.totalPagado.toFixed(2)}€</div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-orange-400">
                                <span className="text-[10px] uppercase font-black text-gray-400">Pendientes</span>
                                <div className="text-2xl font-black text-orange-500">{estadisticas.totalPendiente.toFixed(2)}€</div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-red-500">
                                <span className="text-[10px] uppercase font-black text-gray-400">Abonos</span>
                                <div className="text-2xl font-black text-red-600">{estadisticas.totalAbonos.toFixed(2)}€</div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            {/* Formulario */}
                            <div className="lg:col-span-4">
                                <form onSubmit={manejarAgregar} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4 sticky top-6">
                                    <h2 className="font-bold text-gray-700 mb-4 border-b pb-2 uppercase text-xs tracking-widest">Nuevo Registro</h2>
                                    <input type="text" placeholder="Fábrica" className="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500/20" required value={formulario.fabrica} onChange={e => setFormulario({...formulario, fabrica: e.target.value})} />
                                    <input type="text" placeholder="Cliente" className="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500/20" required value={formulario.cliente} onChange={e => setFormulario({...formulario, cliente: e.target.value})} />
                                    <select className="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none" value={formulario.estado} onChange={e => setFormulario({...formulario, estado: e.target.value})}>
                                        <option value="Pagado">✅ Pagado</option>
                                        <option value="Pendiente de cobro">⏳ Pendiente</option>
                                        <option value="Abono">➖ Abono (Resta)</option>
                                    </select>
                                    <input type="date" className="w-full p-3 bg-gray-50 border rounded-xl outline-none" required value={formulario.fecha} onChange={e => setFormulario({...formulario, fecha: e.target.value})} />
                                    <input type="number" step="0.01" placeholder="Importe €" className="w-full p-3 bg-gray-50 border rounded-xl outline-none font-bold text-lg" required value={formulario.monto} onChange={e => setFormulario({...formulario, monto: e.target.value})} />
                                    <button className="w-full bg-teal-600 hover:bg-teal-700 text-white py-4 rounded-xl font-black shadow-lg shadow-teal-100 transition-all active:scale-95">GUARDAR REGISTRO</button>
                                </form>
                            </div>

                            {/* Tabla de registros */}
                            <div className="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead>
                                            <tr className="bg-gray-50 border-b border-gray-100">
                                                <th className="p-4 text-left text-gray-400 font-black uppercase text-[10px]">Detalle</th>
                                                <th className="p-4 text-left text-gray-400 font-black uppercase text-[10px]">Estado</th>
                                                <th className="p-4 text-right text-gray-400 font-black uppercase text-[10px]">Monto</th>
                                                <th className="p-4"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-50">
                                            {registros.map(r => (
                                                <tr key={r.id} className={`hover:bg-gray-50/80 transition-colors ${r.estado === 'Abono' ? 'bg-red-50/30' : ''}`}>
                                                    <td className="p-4">
                                                        <div className="font-bold text-gray-800 uppercase tracking-tight">{r.fabrica}</div>
                                                        <div className="text-[10px] text-gray-400 font-medium">{r.cliente} | {r.fecha}</div>
                                                    </td>
                                                    <td className="p-4">
                                                        <span className={`text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-tighter ${r.estado === 'Pagado' ? 'bg-emerald-100 text-emerald-700' : r.estado === 'Abono' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>
                                                            {r.estado}
                                                        </span>
                                                    </td>
                                                    <td className={`p-4 text-right font-black text-base ${r.estado === 'Abono' ? 'text-red-600' : r.estado === 'Pendiente de cobro' ? 'text-gray-300 italic' : 'text-gray-900'}`}>
                                                        {r.estado === 'Abono' ? '-' : ''}{r.monto.toFixed(2)}€
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => eliminarRegistro(r.id)} className="text-gray-300 hover:text-red-500 transition-colors">
                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {registros.length === 0 && (
                                                <tr>
                                                    <td colSpan="4" className="p-20 text-center text-gray-300 italic font-medium">No hay registros guardados</td>
                                                </tr>
                                            )}
                                        </tbody>
                                        {registros.length > 0 && (
                                            <tfoot>
                                                <tr className="bg-gray-50 border-t-2 border-gray-200">
                                                    <td colSpan="2" className="p-6 text-right font-black text-xs uppercase text-gray-400">Balance Real Neto:</td>
                                                    <td className="p-6 text-right text-2xl font-black text-teal-700">{estadisticas.balanceReal.toFixed(2)}€</td>
                                                    <td></td>
                                                </tr>
                                            </tfoot>
                                        )}
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
