<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cobros Profesional</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel para ejecutar el código -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #F0F0F0; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        
        // Iconos simplificados con SVG para asegurar compatibilidad total
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const fechaInputRef = useRef(null);
            const [registros, setRegistros] = useState(() => {
                const saved = localStorage.getItem('registros_cobros');
                return saved ? JSON.parse(saved) : [];
            });

            const estadoInicialForm = { fabrica: '', cliente: '', fecha: '', monto: '', estado: 'Pagado' };
            const [nuevoRegistro, setNuevoRegistro] = useState(estadoInicialForm);
            const [confirmarEliminarTodo, setConfirmarEliminarTodo] = useState(false);

            useEffect(() => {
                localStorage.setItem('registros_cobros', JSON.stringify(registros));
            }, [registros]);

            const totales = useMemo(() => {
                return registros.reduce((acc, curr) => {
                    const val = parseFloat(curr.monto) || 0;
                    const efec = curr.estado === 'Abono' ? -val : val;
                    acc.total += efec;
                    if (curr.estado === 'Pagado') acc.pagado += val;
                    else if (curr.estado === 'Pendiente de cobro') acc.pendiente += val;
                    else acc.abonos += val;
                    return acc;
                }, { total: 0, pagado: 0, pendiente: 0, abonos: 0 });
            }, [registros]);

            // Carga dinámica de jsPDF para exportar con Balance Total incluido
            const exportarPDF = async () => {
                const loadScript = (src) => new Promise(r => {
                    const s = document.createElement('script'); s.src = src; s.onload = r; document.head.appendChild(s);
                });
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js');
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(18);
                doc.setTextColor(0, 128, 128);
                doc.text('Reporte de Cobros y Facturación', 14, 20);
                
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(`Fecha de generación: ${new Date().toLocaleDateString()}`, 14, 28);

                const data = registros.map(r => [
                    r.fabrica, 
                    r.cliente, 
                    new Date(r.fecha).toLocaleDateString('es-ES'), 
                    r.estado, 
                    `${r.estado === 'Abono' ? '-' : ''}${r.monto.toFixed(2)} €`
                ]);

                // Añadir fila de Balance Total al PDF
                data.push([
                    { content: 'BALANCE TOTAL (Facturas - Abonos):', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240] } },
                    { content: `${totales.total.toFixed(2)} €`, styles: { fontStyle: 'bold', fillColor: [240, 240, 240] } }
                ]);
                
                doc.autoTable({ 
                    head: [['Fábrica', 'Cliente', 'Fecha', 'Estado', 'Monto']], 
                    body: data, 
                    startY: 35,
                    headStyles: { fillColor: [0, 128, 128] },
                    theme: 'striped'
                });
                
                doc.save(`Reporte_Cobros_${new Date().toISOString().split('T')[0]}.pdf`);
            };

            const agregar = (e) => {
                e.preventDefault();
                setRegistros([{ ...nuevoRegistro, id: Date.now(), monto: parseFloat(nuevoRegistro.monto) }, ...registros]);
                setNuevoRegistro({ ...nuevoRegistro, fecha: '', monto: '' });
                fechaInputRef.current?.focus();
            };

            const borrarTodo = () => {
                if (confirmarEliminarTodo) {
                    setRegistros([]); setNuevoRegistro(estadoInicialForm); setConfirmarEliminarTodo(false);
                } else { setConfirmarEliminarTodo(true); }
            };

            return (
                <div className="max-w-6xl mx-auto p-4">
                    <header className="bg-white p-6 rounded-xl shadow-md border-l-8 border-[#008080] mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <h1 className="text-2xl font-bold text-[#008080]">Gestión de Cobros</h1>
                        <div className="flex gap-2">
                            <button onClick={borrarTodo} className={`px-4 py-2 rounded-lg font-bold text-sm transition-colors ${confirmarEliminarTodo ? 'bg-red-600 text-white animate-pulse' : 'bg-red-50 text-red-500 hover:bg-red-100'}`}>
                                {confirmarEliminarTodo ? '¿Confirmar?' : 'Limpiar Todo'}
                            </button>
                            <button onClick={exportarPDF} className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md transition-colors">Exportar PDF</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                        <div className="bg-white p-3 rounded-lg shadow-sm border-b-4 border-[#008080]">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Balance Total</p>
                            <p className="text-lg font-black">{totales.total.toFixed(2)}€</p>
                        </div>
                        <div className="bg-white p-3 rounded-lg shadow-sm border-b-4 border-emerald-500">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Total Pagado</p>
                            <p className="text-lg font-black text-emerald-600">{totales.pagado.toFixed(2)}€</p>
                        </div>
                        <div className="bg-white p-3 rounded-lg shadow-sm border-b-4 border-orange-400">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Total Pendiente</p>
                            <p className="text-lg font-black text-orange-500">{totales.pendiente.toFixed(2)}€</p>
                        </div>
                        <div className="bg-white p-3 rounded-lg shadow-sm border-b-4 border-red-500">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Total Abonos</p>
                            <p className="text-lg font-black text-red-600">{totales.abonos.toFixed(2)}€</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <form onSubmit={agregar} className="bg-white p-5 rounded-xl shadow-md space-y-4 h-fit border border-gray-100">
                            <div className="space-y-2">
                                <label className="text-[10px] font-bold text-gray-400 uppercase">Datos de Cliente</label>
                                <input type="text" placeholder="Fábrica" className="w-full p-2 border rounded focus:ring-2 focus:ring-[#008080] outline-none" required value={nuevoRegistro.fabrica} onChange={e => setNuevoRegistro({...nuevoRegistro, fabrica: e.target.value})} />
                                <input type="text" placeholder="Cliente" className="w-full p-2 border rounded focus:ring-2 focus:ring-[#008080] outline-none" required value={nuevoRegistro.cliente} onChange={e => setNuevoRegistro({...nuevoRegistro, cliente: e.target.value})} />
                            </div>
                            
                            <div className="space-y-2">
                                <label className="text-[10px] font-bold text-gray-400 uppercase">Detalles Factura</label>
                                <select className="w-full p-2 border rounded font-bold bg-gray-50" value={nuevoRegistro.estado} onChange={e => setNuevoRegistro({...nuevoRegistro, estado: e.target.value})}>
                                    <option value="Pagado">✅ Pagado</option>
                                    <option value="Pendiente de cobro">⏳ Pendiente</option>
                                    <option value="Abono">➖ Abono (Resta del total)</option>
                                </select>
                                <input ref={fechaInputRef} type="date" className="w-full p-2 border rounded focus:ring-2 focus:ring-[#008080] outline-none" required value={nuevoRegistro.fecha} onChange={e => setNuevoRegistro({...nuevoRegistro, fecha: e.target.value})} />
                                <input type="number" step="0.01" placeholder="Importe €" className="w-full p-2 border rounded focus:ring-2 focus:ring-[#008080] outline-none" required value={nuevoRegistro.monto} onChange={e => setNuevoRegistro({...nuevoRegistro, monto: e.target.value})} />
                            </div>
                            
                            <button className="w-full bg-[#008080] hover:bg-[#006666] text-white p-3 rounded-lg font-bold shadow-lg transition-transform active:scale-95">Añadir Registro</button>
                        </form>

                        <div className="lg:col-span-2 bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                            <table className="w-full text-sm">
                                <thead className="bg-[#008080] text-white">
                                    <tr>
                                        <th className="p-3 text-left">Datos Operación</th>
                                        <th className="p-3 text-left">Estado</th>
                                        <th className="p-3 text-right">Monto</th>
                                        <th className="p-3"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {registros.map(r => (
                                        <tr key={r.id} className={`border-b hover:bg-gray-50 transition-colors ${r.estado === 'Abono' ? 'bg-red-50/50' : ''}`}>
                                            <td className="p-3">
                                                <div className="font-bold text-gray-800">{r.fabrica}</div>
                                                <div className="text-xs text-gray-500">{r.cliente} | {new Date(r.fecha).toLocaleDateString()}</div>
                                            </td>
                                            <td className="p-3">
                                                <span className={`text-[9px] font-bold uppercase px-2 py-1 rounded-full ${r.estado === 'Pagado' ? 'bg-emerald-100 text-emerald-700' : r.estado === 'Abono' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>
                                                    {r.estado}
                                                </span>
                                            </td>
                                            <td className={`p-3 text-right font-bold ${r.estado === 'Abono' ? 'text-red-600' : 'text-gray-900'}`}>
                                                {r.estado === 'Abono' ? '-' : ''}{r.monto.toFixed(2)}€
                                            </td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => setRegistros(registros.filter(x => x.id !== r.id))} className="text-gray-300 hover:text-red-500 transition-colors">
                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {registros.length > 0 && (
                                        <tr className="bg-gray-100 font-bold">
                                            <td colSpan="2" className="p-4 text-right text-xs uppercase tracking-widest text-gray-500">Balance Total Acumulado:</td>
                                            <td className={`p-4 text-right text-lg ${totales.total < 0 ? 'text-red-600' : 'text-[#008080]'}`}>
                                                {totales.total.toFixed(2)}€
                                            </td>
                                            <td></td>
                                        </tr>
                                    )}
                                    {registros.length === 0 && (
                                        <tr>
                                            <td colSpan="4" className="p-10 text-center text-gray-400 italic">No hay registros guardados</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
