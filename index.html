<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cobros Profesional</title>
    <!-- Cargamos las librerías desde CDN para que no requiera instalación de paquetes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [registros, setRegistros] = useState(() => {
                try {
                    const saved = localStorage.getItem('registros_cobros');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            const [nuevo, setNuevo] = useState({ fabrica: '', cliente: '', fecha: '', monto: '', estado: 'Pagado' });
            const [confirmar, setConfirmar] = useState(false);

            useEffect(() => {
                localStorage.setItem('registros_cobros', JSON.stringify(registros));
                if (window.lucide) window.lucide.createIcons();
            }, [registros]);

            // LÓGICA: Balance Real = Pagados - Abonos (Pendientes no suman)
            const totales = useMemo(() => {
                return registros.reduce((acc, curr) => {
                    const val = parseFloat(curr.monto) || 0;
                    if (curr.estado === 'Pagado') {
                        acc.total += val;
                        acc.pagado += val;
                    } else if (curr.estado === 'Abono') {
                        acc.total -= val;
                        acc.abonos += val;
                    } else if (curr.estado === 'Pendiente de cobro') {
                        acc.pendiente += val;
                    }
                    return acc;
                }, { total: 0, pagado: 0, pendiente: 0, abonos: 0 });
            }, [registros]);

            const exportarPDF = async () => {
                const load = (src) => new Promise(r => {
                    const s = document.createElement('script'); s.src = src; s.onload = r; document.head.appendChild(s);
                });
                
                if (!window.jspdf) {
                    await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
                    await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js');
                }
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(16);
                doc.setTextColor(0, 128, 128);
                doc.text('REPORTE DE COBROS Y CAJA', 14, 20);
                
                const tableData = registros.map(r => [
                    r.fabrica, r.cliente, r.fecha, r.estado, 
                    `${r.estado === 'Abono' ? '-' : ''}${parseFloat(r.monto).toFixed(2)} €`
                ]);

                tableData.push([
                    { content: 'BALANCE NETO (CAJA REAL):', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold', fillColor: [240, 240, 240] } },
                    { content: `${totales.total.toFixed(2)} €`, styles: { fontStyle: 'bold', fillColor: [240, 240, 240] } }
                ]);

                doc.autoTable({
                    head: [['Fábrica', 'Cliente', 'Fecha', 'Estado', 'Importe']],
                    body: tableData,
                    startY: 30,
                    headStyles: { fillColor: [0, 128, 128] }
                });
                doc.save(`Balance_${new Date().toISOString().split('T')[0]}.pdf`);
            };

            const agregar = (e) => {
                e.preventDefault();
                setRegistros([{ ...nuevo, id: Date.now(), monto: parseFloat(nuevo.monto) }, ...registros]);
                setNuevo({ ...nuevo, fecha: '', monto: '' });
            };

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-10 text-slate-800">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
                        <div>
                            <h1 className="text-3xl font-black text-teal-700 tracking-tight">Caja Profesional</h1>
                            <p className="text-slate-400 text-sm font-medium">Gestión de facturación y abonos</p>
                        </div>
                        <div className="flex gap-3">
                            <button 
                                onClick={() => {
                                    if(confirmar) { setRegistros([]); setConfirmar(false); }
                                    else { setConfirmar(true); setTimeout(() => setConfirmar(false), 3000); }
                                }}
                                className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm ${confirmar ? 'bg-red-600 text-white animate-pulse' : 'bg-red-50 text-red-600 hover:bg-red-100'}`}
                            >
                                {confirmar ? '¿Confirmar borrado?' : 'Vaciar todo'}
                            </button>
                            <button onClick={exportarPDF} className="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-teal-100 transition-all active:scale-95">
                                Exportar PDF
                            </button>
                        </div>
                    </header>

                    {/* Dashboard de Totales */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-teal-500">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Caja Real (Balance)</p>
                            <p className="text-2xl font-black text-teal-800">{totales.total.toFixed(2)}€</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Cobros Pagados</p>
                            <p className="text-2xl font-black text-emerald-600">{totales.pagado.toFixed(2)}€</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-orange-400">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Pendiente (No suma)</p>
                            <p className="text-2xl font-black text-orange-500">{totales.pendiente.toFixed(2)}€</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-red-500">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Abonos</p>
                            <p className="text-2xl font-black text-red-600">{totales.abonos.toFixed(2)}€</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Formulario */}
                        <div className="lg:col-span-4">
                            <form onSubmit={agregar} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-10">
                                <h3 className="text-lg font-bold mb-5 flex items-center gap-2 text-teal-700">
                                    <i data-lucide="plus-circle" className="w-5 h-5"></i> Nuevo Registro
                                </h3>
                                <div className="space-y-4">
                                    <input type="text" placeholder="Fábrica" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all" required value={nuevo.fabrica} onChange={e => setNuevo({...nuevo, fabrica: e.target.value})} />
                                    <input type="text" placeholder="Cliente" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all" required value={nuevo.cliente} onChange={e => setNuevo({...nuevo, cliente: e.target.value})} />
                                    <select className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:ring-2 focus:ring-teal-500/20" value={nuevo.estado} onChange={e => setNuevo({...nuevo, estado: e.target.value})}>
                                        <option value="Pagado">✅ Pagado (Suma)</option>
                                        <option value="Pendiente de cobro">⏳ Pendiente (No suma)</option>
                                        <option value="Abono">➖ Abono (Resta)</option>
                                    </select>
                                    <input type="date" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500/20" required value={nuevo.fecha} onChange={e => setNuevo({...nuevo, fecha: e.target.value})} />
                                    <input type="number" step="0.01" placeholder="Importe (€)" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500/20 font-bold" required value={nuevo.monto} onChange={e => setNuevo({...nuevo, monto: e.target.value})} />
                                    <button className="w-full bg-slate-800 hover:bg-black text-white py-4 rounded-xl font-bold shadow-xl transition-all active:scale-95 flex justify-center items-center gap-2">
                                        <i data-lucide="save" className="w-5 h-5"></i> Guardar entrada
                                    </button>
                                </div>
                            </form>
                        </div>

                        {/* Listado */}
                        <div className="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200">
                                            <th className="p-5 text-[11px] font-black text-slate-400 uppercase">Detalles Operación</th>
                                            <th className="p-5 text-[11px] font-black text-slate-400 uppercase">Estado</th>
                                            <th className="p-5 text-right text-[11px] font-black text-slate-400 uppercase">Importe</th>
                                            <th className="p-5"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {registros.map(r => (
                                            <tr key={r.id} className={`group hover:bg-slate-50/50 transition-colors ${r.estado === 'Abono' ? 'bg-red-50/30' : r.estado === 'Pendiente de cobro' ? 'bg-orange-50/20' : ''}`}>
                                                <td className="p-5">
                                                    <div className="font-bold text-slate-800">{r.fabrica}</div>
                                                    <div className="text-xs text-slate-500 font-medium">{r.cliente} • {r.fecha}</div>
                                                </td>
                                                <td className="p-5">
                                                    <span className={`text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-tight ${r.estado === 'Pagado' ? 'bg-emerald-100 text-emerald-700' : r.estado === 'Abono' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>
                                                        {r.estado}
                                                    </span>
                                                </td>
                                                <td className={`p-5 text-right font-black text-lg ${r.estado === 'Abono' ? 'text-red-600' : r.estado === 'Pendiente de cobro' ? 'text-slate-400' : 'text-slate-900'}`}>
                                                    {r.estado === 'Abono' ? '-' : ''}{parseFloat(r.monto).toFixed(2)}€
                                                </td>
                                                <td className="p-5 text-center">
                                                    <button onClick={() => setRegistros(registros.filter(x => x.id !== r.id))} className="p-2 text-slate-300 hover:text-red-500 transition-colors">
                                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {registros.length === 0 && (
                                            <tr>
                                                <td colSpan="4" className="p-20 text-center">
                                                    <div className="flex flex-col items-center gap-3 text-slate-300">
                                                        <i data-lucide="database" className="w-12 h-12"></i>
                                                        <p className="font-medium italic">No hay datos registrados aún</p>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                    {registros.length > 0 && (
                                        <tfoot>
                                            <tr className="bg-slate-50 border-t-2 border-slate-200">
                                                <td colSpan="2" className="p-6 text-right font-black text-xs uppercase tracking-widest text-slate-400">Balance Real de Caja:</td>
                                                <td className="p-6 text-right text-2xl font-black text-teal-700">{totales.total.toFixed(2)}€</td>
                                                <td></td>
                                            </tr>
                                        </tfoot>
                                    )}
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
