<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cobros Profesional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const App = () => {
            const [registros, setRegistros] = useState(() => {
                const saved = localStorage.getItem('registros_cobros');
                return saved ? JSON.parse(saved) : [];
            });

            const [nuevo, setNuevo] = useState({ fabrica: '', cliente: '', fecha: '', monto: '', estado: 'Pagado' });
            const [confirmar, setConfirmar] = useState(false);

            useEffect(() => {
                localStorage.setItem('registros_cobros', JSON.stringify(registros));
                lucide.createIcons();
            }, [registros]);

            const totales = useMemo(() => {
                return registros.reduce((acc, curr) => {
                    const val = parseFloat(curr.monto) || 0;
                    
                    // Lógica de Balance Total: Solo Pagados suman, Abonos restan.
                    if (curr.estado === 'Pagado') {
                        acc.total += val;
                        acc.pagado += val;
                    } else if (curr.estado === 'Abono') {
                        acc.total -= val;
                        acc.abonos += val;
                    } else if (curr.estado === 'Pendiente de cobro') {
                        // Los pendientes NO suman al total principal
                        acc.pendiente += val;
                    }
                    
                    return acc;
                }, { total: 0, pagado: 0, pendiente: 0, abonos: 0 });
            }, [registros]);

            const exportarPDF = async () => {
                const load = (src) => new Promise(r => {
                    const s = document.createElement('script'); s.src = src; s.onload = r; document.head.appendChild(s);
                });
                if (!window.jspdf) {
                    await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
                    await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js');
                }
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFontSize(16);
                doc.setTextColor(0, 128, 128);
                doc.text('REPORTE DE COBROS Y ABONOS', 14, 20);
                
                const data = registros.map(r => [
                    r.fabrica, r.cliente, r.fecha, r.estado, 
                    `${r.estado === 'Abono' ? '-' : ''}${parseFloat(r.monto).toFixed(2)} €`
                ]);

                data.push([
                    { content: 'BALANCE REAL (PAGADOS - ABONOS):', colSpan: 4, styles: { halign: 'right', fontStyle: 'bold', fillColor: [230, 230, 230] } },
                    { content: `${totales.total.toFixed(2)} €`, styles: { fontStyle: 'bold', fillColor: [230, 230, 230] } }
                ]);

                doc.autoTable({
                    head: [['Fábrica', 'Cliente', 'Fecha', 'Estado', 'Importe']],
                    body: data,
                    startY: 30,
                    headStyles: { fillColor: [0, 128, 128] }
                });
                doc.save('reporte_cobros.pdf');
            };

            const agregar = (e) => {
                e.preventDefault();
                setRegistros([{ ...nuevo, id: Date.now(), monto: parseFloat(nuevo.monto) }, ...registros]);
                setNuevo({ ...nuevo, fecha: '', monto: '' });
            };

            const borrarTodo = () => {
                if (confirmar) {
                    setRegistros([]);
                    setNuevo({ fabrica: '', cliente: '', fecha: '', monto: '', estado: 'Pagado' });
                    setConfirmar(false);
                } else { setConfirmar(true); }
            };

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-8">
                    <div className="bg-white p-6 rounded-xl shadow-lg border-l-8 border-[#008080] mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-[#008080]">Gestión de Facturas</h1>
                            <p className="text-gray-400 text-xs uppercase font-bold italic">Pendientes no afectan al balance real</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={borrarTodo} className={`px-4 py-2 rounded-lg font-bold text-sm transition-all ${confirmar ? 'bg-red-600 text-white animate-pulse' : 'bg-red-50 text-red-500'}`}>
                                {confirmar ? '¿BORRAR TODO?' : 'Limpiar Todo'}
                            </button>
                            <button onClick={exportarPDF} className="bg-orange-500 text-white px-6 py-2 rounded-lg font-bold shadow-md hover:bg-orange-600">PDF</button>
                        </div>
                    </div>

                    {/* Tarjetas de Resumen */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-white p-4 rounded-xl shadow border-b-4 border-[#008080]">
                            <span className="text-[10px] font-bold text-gray-400 uppercase">Balance Real (Caja)</span>
                            <div className="text-xl font-black">{totales.total.toFixed(2)}€</div>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow border-b-4 border-emerald-500">
                            <span className="text-[10px] font-bold text-gray-400 uppercase">Total Pagado</span>
                            <div className="text-xl font-black text-emerald-600">{totales.pagado.toFixed(2)}€</div>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow border-b-4 border-orange-400">
                            <span className="text-[10px] font-bold text-gray-400 uppercase">Total Pendiente</span>
                            <div className="text-xl font-black text-orange-500">{totales.pendiente.toFixed(2)}€</div>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow border-b-4 border-red-500">
                            <span className="text-[10px] font-bold text-gray-400 uppercase">Total Abonos</span>
                            <div className="text-xl font-black text-red-600">{totales.abonos.toFixed(2)}€</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <form onSubmit={agregar} className="bg-white p-6 rounded-xl shadow-md space-y-4 border border-gray-100 h-fit">
                            <h2 className="font-bold text-[#008080] border-b pb-2 uppercase text-sm">Nueva Entrada</h2>
                            <input type="text" placeholder="Fábrica" className="w-full p-2 border rounded" required value={nuevo.fabrica} onChange={e => setNuevo({...nuevo, fabrica: e.target.value})} />
                            <input type="text" placeholder="Cliente" className="w-full p-2 border rounded" required value={nuevo.cliente} onChange={e => setNuevo({...nuevo, cliente: e.target.value})} />
                            <select className="w-full p-2 border rounded font-bold bg-gray-50" value={nuevo.estado} onChange={e => setNuevo({...nuevo, estado: e.target.value})}>
                                <option value="Pagado">✅ Pagado</option>
                                <option value="Pendiente de cobro">⏳ Pendiente</option>
                                <option value="Abono">➖ Abono (Resta)</option>
                            </select>
                            <input type="date" className="w-full p-2 border rounded" required value={nuevo.fecha} onChange={e => setNuevo({...nuevo, fecha: e.target.value})} />
                            <input type="number" step="0.01" placeholder="Importe €" className="w-full p-2 border rounded" required value={nuevo.monto} onChange={e => setNuevo({...nuevo, monto: e.target.value})} />
                            <button className="w-full bg-[#008080] text-white p-3 rounded-lg font-bold shadow-lg hover:bg-[#006666] transition-all">Añadir Registro</button>
                        </form>

                        <div className="lg:col-span-2 bg-white rounded-xl shadow-md overflow-x-auto border border-gray-100">
                            <table className="w-full text-sm">
                                <thead className="bg-[#008080] text-white">
                                    <tr>
                                        <th className="p-3 text-left">Datos</th>
                                        <th className="p-3 text-left">Estado</th>
                                        <th className="p-3 text-right">Monto</th>
                                        <th className="p-3"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {registros.map(r => (
                                        <tr key={r.id} className={`border-b hover:bg-gray-50 ${r.estado === 'Abono' ? 'bg-red-50' : r.estado === 'Pendiente de cobro' ? 'bg-orange-50/30' : ''}`}>
                                            <td className="p-3">
                                                <div className="font-bold">{r.fabrica}</div>
                                                <div className="text-[10px] text-gray-500">{r.cliente} | {r.fecha}</div>
                                            </td>
                                            <td className="p-3">
                                                <span className={`text-[10px] font-bold px-2 py-1 rounded-full ${r.estado === 'Pagado' ? 'bg-green-100 text-green-700' : r.estado === 'Abono' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>
                                                    {r.estado}
                                                </span>
                                            </td>
                                            <td className={`p-3 text-right font-bold ${r.estado === 'Abono' ? 'text-red-600' : r.estado === 'Pendiente de cobro' ? 'text-gray-400' : 'text-gray-900'}`}>
                                                {r.estado === 'Abono' ? '-' : ''}{r.monto.toFixed(2)}€
                                            </td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => setRegistros(registros.filter(x => x.id !== r.id))} className="text-gray-300 hover:text-red-500">
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {registros.length > 0 && (
                                        <tr className="bg-gray-100 font-bold">
                                            <td colSpan="2" className="p-4 text-right text-xs uppercase text-gray-500">Balance Real Final (Caja):</td>
                                            <td className="p-4 text-right text-lg text-[#008080]">{totales.total.toFixed(2)}€</td>
                                            <td></td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
